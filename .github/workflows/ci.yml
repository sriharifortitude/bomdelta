name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Tests on Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.77 is the rust-version declared in Cargo.toml; building on it
        # is what makes that declaration true rather than aspirational.
        toolchain: ['1.77', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked

  readme:
    name: README demo output matches the binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - name: Diff the README block against a fresh run
        run: |
          awk '/<!-- demo-output:start -->/{f=1;next} /<!-- demo-output:end -->/{f=0} f' README.md | sed '1d;$d' > readme-demo.txt
          # exit 1 is expected here: the demo is meant to fail --fail-on high
          ./target/release/bomdelta testdata/npm-before.cdx.json testdata/npm-after.cdx.json > actual-demo.txt || test $? -eq 1
          diff readme-demo.txt actual-demo.txt

  secrets:
    name: credsweep over the full commit history
    runs-on: ubuntu-latest
    steps:
      # A shallow clone would let credsweep report a false all-clear.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      # v0.1.1, not v0.1.0: v0.1.0 reported two lines of src/license.rs as
      # secrets, which is the bug v0.1.1 fixes.
      - run: go install github.com/sriharifortitude/credsweep/cmd/credsweep@v0.1.1
      - run: credsweep scan .
